services:
  frontend:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-http://localhost:8080/api}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - public_net
    depends_on:
      backend:
        condition: service_healthy
